<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PageTurn — Online Bookstore</title>
<style>
  :root{
    --bg:#FAF7F2;
    --surface:#FFFFFF;
    --ink:#2B241C;
    --muted:#7A6F60;
    --line:#E8E0D3;
    --accent:#8B4A3B;
    --accent-soft:#F3E2DC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI', system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  header{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:18px 32px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:10;
  }
  .logo{
    font-size:20px;
    font-weight:800;
    color:var(--accent);
  }
  .cart-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    position:relative;
  }
  .cart-count{
    background:#fff;
    color:var(--accent);
    border-radius:50%;
    font-size:11px;
    width:18px;
    height:18px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-left:6px;
    font-weight:800;
  }
  .hero{
    text-align:center;
    padding:44px 20px 20px;
  }
  .hero h1{
    font-size:32px;
    margin-bottom:8px;
  }
  .hero p{
    color:var(--muted);
    font-size:14px;
  }
  .controls{
    display:flex;
    gap:10px;
    justify-content:center;
    padding:24px 20px;
    flex-wrap:wrap;
  }
  .controls input, .controls select{
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    font-size:13px;
    background:var(--surface);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:20px;
    max-width:1100px;
    margin:0 auto;
    padding:0 32px 60px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
    display:flex;
    flex-direction:column;
  }
  .cover{
    height:130px;
    border-radius:8px;
    background:var(--accent-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    margin-bottom:14px;
  }
  .card h3{
    font-size:15px;
    margin-bottom:4px;
  }
  .card .author{
    font-size:12px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .card .genre{
    display:inline-block;
    font-size:11px;
    background:var(--accent-soft);
    color:var(--accent);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:12px;
    width:fit-content;
  }
  .card .price{
    font-size:16px;
    font-weight:700;
    margin-bottom:12px;
  }
  .card button{
    margin-top:auto;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:9px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .card button:hover{opacity:.9;}

  .drawer{
    position:fixed;
    top:0;
    right:-360px;
    width:340px;
    height:100%;
    background:var(--surface);
    box-shadow:-4px 0 20px rgba(0,0,0,.08);
    transition:right .25s ease;
    padding:24px;
    display:flex;
    flex-direction:column;
    z-index:20;
  }
  .drawer.open{ right:0; }
  .drawer h2{
    font-size:18px;
    margin-bottom:18px;
  }
  .drawer .close{
    position:absolute;
    top:20px;
    right:20px;
    background:none;
    border:none;
    font-size:18px;
    cursor:pointer;
    color:var(--muted);
  }
  .cart-items{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }
  .cart-item button{
    background:none;
    border:none;
    color:var(--accent);
    cursor:pointer;
    font-size:12px;
  }
  .cart-total{
    border-top:1px solid var(--line);
    padding-top:14px;
    margin-top:14px;
    display:flex;
    justify-content:space-between;
    font-weight:700;
    font-size:15px;
  }
  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.3);
    z-index:15;
  }
  .overlay.open{ display:block; }
  .empty-cart{ color:var(--muted); font-size:13px; text-align:center; margin-top:20px;}
</style>
</head>
<body>

<header>
  <div class="logo">📚 PageTurn</div>
  <button class="cart-btn" onclick="toggleCart(true)">Cart <span class="cart-count" id="cartCount">0</span></button>
</header>

<div class="hero">
  <h1>Find your next favorite book</h1>
  <p>Browse, search, and add books to your cart — all data is handled locally in your browser.</p>
</div>

<div class="controls">
  <input type="text" id="searchInput" placeholder="Search by title or author...">
  <select id="genreFilter">
    <option value="all">All Genres</option>
    <option value="Fiction">Fiction</option>
    <option value="Non-Fiction">Non-Fiction</option>
    <option value="Sci-Fi">Sci-Fi</option>
    <option value="Mystery">Mystery</option>
  </select>
</div>

<div class="grid" id="bookGrid"></div>

<div class="overlay" id="overlay" onclick="toggleCart(false)"></div>
<div class="drawer" id="cartDrawer">
  <button class="close" onclick="toggleCart(false)">✕</button>
  <h2>Your Cart</h2>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-total">
    <span>Total</span>
    <span id="cartTotal">₹0</span>
  </div>
</div>

<script>
  const books = [
    { id:1, title:"The Silent Orbit", author:"A. Rao", genre:"Sci-Fi", price:349, emoji:"🚀" },
    { id:2, title:"Whispers in Rain", author:"M. Iyer", genre:"Fiction", price:299, emoji:"🌧️" },
    { id:3, title:"The Last Ledger", author:"K. Nathan", genre:"Mystery", price:399, emoji:"🕵️" },
    { id:4, title:"Atoms & Ideas", author:"S. Verma", genre:"Non-Fiction", price:449, emoji:"🧪" },
    { id:5, title:"Coral Streets", author:"R. Menon", genre:"Fiction", price:279, emoji:"🏙️" },
    { id:6, title:"Beyond Andromeda", author:"P. Suresh", genre:"Sci-Fi", price:399, emoji:"🌌" },
    { id:7, title:"The Quiet Witness", author:"J. Thomas", genre:"Mystery", price:329, emoji:"🔍" },
    { id:8, title:"Minds & Machines", author:"D. Krishnan", genre:"Non-Fiction", price:499, emoji:"🤖" },
  ];

  let cart = JSON.parse(localStorage.getItem('bookstore_cart') || '[]');

  const grid = document.getElementById('bookGrid');
  const searchInput = document.getElementById('searchInput');
  const genreFilter = document.getElementById('genreFilter');

  function renderBooks(){
    const query = searchInput.value.toLowerCase();
    const genre = genreFilter.value;

    const filtered = books.filter(b =>
      (b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query)) &&
      (genre === 'all' || b.genre === genre)
    );

    grid.innerHTML = filtered.map(b => `
      <div class="card">
        <div class="cover">${b.emoji}</div>
        <h3>${b.title}</h3>
        <div class="author">by ${b.author}</div>
        <div class="genre">${b.genre}</div>
        <div class="price">₹${b.price}</div>
        <button onclick="addToCart(${b.id})">Add to Cart</button>
      </div>
    `).join('') || `<p style="color:var(--muted); grid-column:1/-1; text-align:center;">No books match your search.</p>`;
  }

  function addToCart(id){
    const existing = cart.find(c => c.id === id);
    if(existing){ existing.qty += 1; }
    else{
      const book = books.find(b => b.id === id);
      cart.push({ ...book, qty: 1 });
    }
    saveCart();
    renderCart();
    toggleCart(true);
  }

  function removeFromCart(id){
    cart = cart.filter(c => c.id !== id);
    saveCart();
    renderCart();
  }

  function saveCart(){
    localStorage.setItem('bookstore_cart', JSON.stringify(cart));
  }

  function renderCart(){
    const cartItems = document.getElementById('cartItems');
    const cartCount = document.getElementById('cartCount');
    const cartTotal = document.getElementById('cartTotal');

    if(cart.length === 0){
      cartItems.innerHTML = `<div class="empty-cart">Your cart is empty.</div>`;
    } else {
      cartItems.innerHTML = cart.map(c => `
        <div class="cart-item">
          <span>${c.title} × ${c.qty}</span>
          <span>₹${c.price * c.qty} <button onclick="removeFromCart(${c.id})">Remove</button></span>
        </div>
      `).join('');
    }

    const totalCount = cart.reduce((sum, c) => sum + c.qty, 0);
    const totalPrice = cart.reduce((sum, c) => sum + c.price * c.qty, 0);
    cartCount.textContent = totalCount;
    cartTotal.textContent = `₹${totalPrice}`;
  }

  function toggleCart(open){
    document.getElementById('cartDrawer').classList.toggle('open', open);
    document.getElementById('overlay').classList.toggle('open', open);
  }

  searchInput.addEventListener('input', renderBooks);
  genreFilter.addEventListener('change', renderBooks);

  renderBooks();
  renderCart();
</script>
</body>
</html>
