<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Simple Task Manager</title>
<style>
  :root{
    --bg:#F6F7F5;
    --surface:#FFFFFF;
    --ink:#1C2321;
    --muted:#6B7570;
    --line:#E3E6E2;
    --accent:#3E6259;
    --accent-soft:#DCEAE4;
    --danger:#B0553A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  header{
    margin-bottom:28px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    font-size:32px;
    margin:0 0 6px;
    letter-spacing:-0.02em;
  }
  .sub{
    color:var(--muted);
    font-size:14px;
    margin:0;
  }
  .stats{
    display:flex;
    gap:12px;
    margin:22px 0;
  }
  .stat{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .stat .num{
    font-size:22px;
    font-weight:700;
  }
  .stat .label{
    font-size:12px;
    color:var(--muted);
  }
  form{
    display:flex;
    gap:8px;
    margin-bottom:22px;
  }
  input[type=text]{
    flex:1;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:14px;
    color:var(--ink);
  }
  input[type=text]:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  select{
    padding:12px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:13px;
    color:var(--ink);
  }
  button{
    cursor:pointer;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
  }
  .add-btn{
    background:var(--accent);
    color:#fff;
    padding:12px 18px;
  }
  .add-btn:hover{opacity:.92;}
  .filters{
    display:flex;
    gap:6px;
    margin-bottom:14px;
  }
  .filters button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:6px 14px;
    border-radius:20px;
    font-size:13px;
  }
  .filters button.active{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:var(--accent-soft);
  }
  ul{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  li{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  li.done .task-text{
    text-decoration:line-through;
    color:var(--muted);
  }
  .checkbox{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid var(--accent);
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    padding:0;
  }
  li.done .checkbox{
    background:var(--accent);
  }
  li.done .checkbox::after{
    content:"✓";
    color:#fff;
    font-size:12px;
  }
  .task-text{
    flex:1;
    font-size:14px;
  }
  .tag{
    font-size:11px;
    padding:3px 8px;
    border-radius:20px;
    background:var(--accent-soft);
    color:var(--accent);
    white-space:nowrap;
  }
  .delete-btn{
    background:transparent;
    color:var(--danger);
    font-size:13px;
    padding:4px 8px;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:40px 0;
  }
  footer{
    margin-top:30px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">TaskFlow</div>
    <h1>Today's Tasks</h1>
    <p class="sub">Add, prioritize, and track your tasks — saved automatically in your browser.</p>
    <a href="index.html" style="font-size:12px; color:var(--accent); text-decoration:none; font-weight:600;">← Back to Portfolio</a>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="totalCount">0</div><div class="label">Total</div></div>
    <div class="stat"><div class="num" id="doneCount">0</div><div class="label">Completed</div></div>
    <div class="stat"><div class="num" id="pendingCount">0</div><div class="label">Pending</div></div>
  </div>

  <form id="taskForm">
    <input type="text" id="taskInput" placeholder="What do you need to do?" required>
    <select id="priorityInput">
      <option value="Low">Low</option>
      <option value="Medium" selected>Medium</option>
      <option value="High">High</option>
    </select>
    <button type="submit" class="add-btn">Add</button>
  </form>

  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="pending">Pending</button>
    <button data-filter="done">Completed</button>
  </div>

  <ul id="taskList"></ul>
  <div class="empty" id="emptyState" style="display:none;">No tasks here yet. Add one above.</div>

  <footer>Built with HTML, CSS &amp; JavaScript · Data stored locally in your browser (localStorage)</footer>
</div>

<script>
  const STORAGE_KEY = 'taskflow_tasks';
  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentFilter = 'all';

  const taskForm = document.getElementById('taskForm');
  const taskInput = document.getElementById('taskInput');
  const priorityInput = document.getElementById('priorityInput');
  const taskList = document.getElementById('taskList');
  const emptyState = document.getElementById('emptyState');
  const filterButtons = document.querySelectorAll('.filters button');

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function render(){
    taskList.innerHTML = '';
    let visible = tasks;
    if(currentFilter === 'pending') visible = tasks.filter(t => !t.done);
    if(currentFilter === 'done') visible = tasks.filter(t => t.done);

    emptyState.style.display = visible.length === 0 ? 'block' : 'none';

    visible.forEach(task => {
      const li = document.createElement('li');
      li.className = task.done ? 'done' : '';
      li.innerHTML = `
        <button class="checkbox" data-id="${task.id}"></button>
        <span class="task-text">${task.text}</span>
        <span class="tag">${task.priority}</span>
        <button class="delete-btn" data-id="${task.id}">Delete</button>
      `;
      taskList.appendChild(li);
    });

    document.getElementById('totalCount').textContent = tasks.length;
    document.getElementById('doneCount').textContent = tasks.filter(t => t.done).length;
    document.getElementById('pendingCount').textContent = tasks.filter(t => !t.done).length;
  }

  taskForm.addEventListener('submit', e => {
    e.preventDefault();
    const text = taskInput.value.trim();
    if(!text) return;
    tasks.unshift({
      id: Date.now().toString(),
      text,
      priority: priorityInput.value,
      done: false
    });
    taskInput.value = '';
    save();
    render();
  });

  taskList.addEventListener('click', e => {
    const id = e.target.dataset.id;
    if(!id) return;
    if(e.target.classList.contains('checkbox')){
      const task = tasks.find(t => t.id === id);
      task.done = !task.done;
      save();
      render();
    }
    if(e.target.classList.contains('delete-btn')){
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }
  });

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  render();
</script>
</body>
</html>
