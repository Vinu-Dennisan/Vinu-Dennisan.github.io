
name: Build Student Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: projects/studentportal
        run: npm ci

      - name: Build React app
        working-directory: projects/studentportal
        run: npm run build
        env:
          CI: "false"
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Prepare website
        run: |
          mkdir -p site
          rsync -av ./ site/ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/site/' \
            --exclude='/node_modules/' \
            --exclude='/projects/studentportal/' \
            --exclude='/build/'
          mkdir -p site/projects/studentportal
          cp -R projects/studentportal/build/. site/projects/studentportal/
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish website
        uses: actions/deploy-pages@v4
